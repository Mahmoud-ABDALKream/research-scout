name: Research Scout Daily Run

# Runs the Research Scout agent every day at 9 AM EET (7 AM UTC)
# EET = UTC+2, so 9 AM EET = 7 AM UTC
on:
  schedule:
    - cron: '0 7 * * *'  # 7:00 UTC = 9:00 EET
  workflow_dispatch: {}  # allow manual trigger from GitHub UI

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install z-ai CLI
        run: |
          npm install -g z-ai-web-dev-sdk
          echo "z-ai CLI installed"

      - name: Run Research Scout
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SCOUT_DIR: ${{ github.workspace }}/agent_mvp
          SCOUT_EMAIL_WEBHOOK: ${{ secrets.SCOUT_EMAIL_WEBHOOK }}
        run: |
          cd agent_mvp
          python3 scout.py 2>&1 | tee run_output.txt
          echo "--- EXIT CODE: $? ---"

      - name: Upload run capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-run-${{ github.run_id }}
          path: |
            agent_mvp/run_output.txt
            agent_mvp/run_capture.txt
          retention-days: 30

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-${{ github.run_id }}
          path: agent_mvp/audit_log.json
          retention-days: 30

      - name: Upload daily digest (email-ready)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: agent_mvp/digest_email.txt
          retention-days: 30

      - name: Upload history log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ github.run_id }}
          path: agent_mvp/history.jsonl
          retention-days: 90

      - name: Print digest to job summary
        if: always()
        run: |
          echo "## Research Scout Daily Digest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f agent_mvp/digest_email.txt ]; then
            cat agent_mvp/digest_email.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "_(No digest produced — check logs)_" >> $GITHUB_STEP_SUMMARY
          fi
